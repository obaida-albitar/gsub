name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-24.04
    # The distro python3-gi stack is used instead of pip PyGObject: the
    # source-built pip PyGObject cannot find Ubuntu's GIRepository typelibs,
    # which breaks both the app imports and the blueprint compiler.
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            libglib2.0-dev-bin \
            libmpv2 \
            xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages \
            pytest pytest-cov pytest-xdist 'ruff==0.15.16'
          python3 -m pip install --break-system-packages \
            python-mpv PyOpenGL av charset-normalizer
          # --no-deps: blueprint-compiler must use the distro gi, not a
          # pip-installed PyGObject; likewise gsub's gi/pycairo come from apt.
          python3 -m pip install --break-system-packages --no-deps blueprint-compiler
          python3 -m pip install --break-system-packages --no-deps -e .

      - name: Lint
        run: ruff check .

      # pip's editable install does not run setup.py's build_py hook, so the
      # gresource is compiled explicitly (same as `make install` does locally).
      - name: Build UI resources
        run: make build-resources

      - name: Run tests (virtual display)
        run: xvfb-run -a python3 -m pytest

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gsub-${{ github.ref_name }}.x86_64.flatpak
          manifest-path: io.github.obaidaalbitar.gsub.yml
          artifact-name: gsub-flatpak-bundle
          cache-key: flatpak-builder-v1

  release:
    name: Attach Flatpak bundle to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gsub-flatpak-bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" gsub-*.flatpak --clobber
