name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev-bin \
            libcairo2-dev \
            libmpv-dev \
            libmpv2 \
            pkg-config \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      # pip's editable install does not run setup.py's build_py hook, so the
      # gresource is compiled explicitly (same as `make install` does locally).
      - name: Build UI resources
        run: make build-resources

      - name: Run tests (virtual display)
        run: xvfb-run -a pytest
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gsub-${{ github.ref_name }}.x86_64.flatpak
          manifest-path: io.github.obaidaalbitar.gsub.yml
          artifact-name: gsub-flatpak-bundle
          cache-key: flatpak-builder-v1

  release:
    name: Attach Flatpak bundle to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gsub-flatpak-bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" gsub-*.flatpak --clobber
