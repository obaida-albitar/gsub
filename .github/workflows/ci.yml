name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-latest
    # Debian testing (forky) carries libadwaita 1.9, satisfying the app's
    # >=1.8 minimum (Adw.ShortcutsDialog & friends); trixie is stuck on 1.7
    # and Ubuntu 24.04 on 1.5. The distro python3-gi is used because the
    # pip-built PyGObject cannot find the system GIRepository typelibs.
    container: debian:testing
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git make \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            libglib2.0-dev-bin \
            libegl1 \
            libgl1-mesa-dri \
            libmpv2 \
            xvfb \
            xauth

      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages \
            pytest pytest-cov pytest-xdist 'ruff==0.15.16'
          python3 -m pip install --break-system-packages \
            python-mpv PyOpenGL av charset-normalizer
          # --no-deps: blueprint-compiler must use the distro gi, not a
          # pip-installed PyGObject; likewise gsub's gi/pycairo come from apt.
          python3 -m pip install --break-system-packages --no-deps blueprint-compiler
          python3 -m pip install --break-system-packages --no-deps -e .

      - name: Lint
        run: ruff check .

      # pip's editable install does not run setup.py's build_py hook, so the
      # gresource is compiled explicitly (same as `make install` does locally).
      - name: Build UI resources
        run: make build-resources

      # Import the widget package directly so a broken import fails loudly
      # here, instead of being swallowed by the test files' skip gates and
      # resurfacing later as an opaque GType collision during collection.
      - name: Smoke-test widget imports
        run: xvfb-run -a python3 -c "from gsub.resources import register_resources; register_resources(); import gsub.widgets"

      # -rs prints the skip reasons (including module-level import skips).
      - name: Run tests (virtual display)
        run: xvfb-run -a python3 -m pytest -rs

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gsub-${{ github.ref_name }}.x86_64.flatpak
          manifest-path: io.github.obaidaalbitar.gsub.yml
          cache-key: flatpak-builder-v1

  release:
    name: Attach Flatpak bundle to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # flatpak-builder@v6 derives the artifact name from the bundle input by
      # appending the arch again (e.g. gsub-v0.7.x86_64-x86_64.flatpak), so
      # match by pattern instead of a fixed name.
      - uses: actions/download-artifact@v4
        with:
          pattern: gsub-*

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" gsub-*.flatpak --clobber
